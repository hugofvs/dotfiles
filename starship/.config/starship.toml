add_newline = false
command_timeout = 1000

continuation_prompt = "[∙ ](surface1)"


# format = "$shell$sudo $character"

format = """
[░▒▓](surface1)\
$directory\
[](fg:surface1 bg:#212736)\
$git_branch\
[](fg:surface0)\
\n$shell$sudo $character
"""

right_format = "$time"


palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[fill]
symbol = ''

[character]
format = "$symbol "
success_symbol = "[❯](teal)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"


[sudo]
format = "[$symbol]($style)"
style = "teal"
symbol = ""
disabled = false

[shell]
format = "[$indicator]($style) "
style = "surface2 dimmed"
nu_indicator = "nu"
zsh_indicator = "zsh"
disabled = false

[directory]
# home_symbol = "󰠦"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
use_os_path_sep = true
style = "fg:#769ff0 bg:#394260"
format = "[ $path$read_only ]($style)"

[directory.substitutions]
"~" = "  "
"Documents" = " 󰈙 "
"Downloads" = "  "
"Music" = " 󰝚  "
"Pictures" = "   "
"Projects" = " 󰲋  "
"~/Projects/*" = " 󰲋  "

[git_branch]
format = "[[  $symbol $branch ](fg:#769ff0 bg:surface0)]($style)"
symbol = ""
style = "fg:surface1 blue"
truncation_symbol = "⋯"
truncation_length = 11
ignore_branches = []
only_attached = true

[time]
disabled = false
format = "[  $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed surface2"
